name: Go tests

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Run tests
              run: go test -v -count=1 ./...
